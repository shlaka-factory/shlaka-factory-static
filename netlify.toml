# Netlify deploy config — Shlaka Factory static site
# (privacy policy + terms of service + landing for TikTok review)

[build]
  publish = "."

# Friendly aliases without .html
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Security headers — TikTok review may check basic hygiene
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
